</head>
<body>
     <div class="encabezado">
        <h1>collar con cauchos</h1>
        <p>Frases que llevas siempre contigo</p>
    </div>

<p>

    <main>
        <section class="calculadora">
            <h2>Calcula tu pedido</h2>
            <label for="producto">Selecciona un producto:</label>
            <select id="producto" onchange="mostrarPrecio()">
                <option value="seleccion">-- Selecciona un Producto --</option>
                <option value="camiseta">manilla</option>
                <option value="gorra">Collar</option>
                <option value="mochila">llavero</option>
            </select>
            <p>
                Precio:
                <span id="precio">$0</span>
            </p>
            <label for="cantidad">Cantidad:</label>

            <input type="number" id="cantidad" min="1" value="1">
            <button onclick="calcularPedido()">
                Calcular pedido
            </button>
            <div id="resultado">
                <p>Subtotal: <span id="subtotal">$0</span></p>
                <p>Descuento: <span id="descuento">$0</span></p>
                <p class="total">
                    Total: <span id="total">$0</span>
                </p>
            </div>
        </section>
    </main>

    <script>let precios = {
    seleccion: "",
    camiseta: 40000,
    gorra: 25000,
    mochila: 60000
};

function mostrarPrecio() {

    let producto = document.getElementById("producto").value;
    let precio = precios[producto];
    document.getElementById("precio").textContent = "$" + precio;

}

function calcularPedido() {

    let producto = document.getElementById("producto").value;
    let cantidad = document.getElementById("cantidad").value;
    let precio = precios[producto];
    let subtotal = precio * cantidad;
    let descuento = 0;

    if (subtotal >= 100000) {
        descuento = subtotal * 0.5;
    }

    let total = subtotal - descuento;
    document.getElementById("subtotal").textContent = "$" + subtotal;
    document.getElementById("descuento").textContent = "$" + descuento;
    document.getElementById("total").textContent = "$" + total;

}</script>
<div class="pie">

    </div>
